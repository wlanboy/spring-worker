spring.application.name=worker

# --- Graceful shutdown -------------------------------------------------------
# Tomcat stops accepting new requests and waits for in-flight (incl. async) requests.
server.shutdown=graceful
# Max time per lifecycle phase (web server graceful phase, executors, ...).
spring.lifecycle.timeout-per-shutdown-phase=45s

# Async MVC request timeout (Callable / CompletableFuture). Must be > worker.duration,
# otherwise Tomcat's default (30s) kills the request.
spring.mvc.async.request-timeout=60s

# --- Actuator ----------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# --- Worker ------------------------------------------------------------------
worker.duration=30s
worker.pool-size=4
worker.shutdown-timeout=45s
